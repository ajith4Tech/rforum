apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rforum.fullname" . }}-migrate
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before install and upgrade; delete completed job before creating a new one.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "rforum.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for Postgres to be ready before running migrations.
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "rforum.fullname" . }}-postgres -U rforum; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
      containers:
        - name: migrate
          image: {{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          workingDir: /workspace
          command: ["alembic", "-c", "db/alembic.ini", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rforum.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql+asyncpg://rforum:$(POSTGRES_PASSWORD)@{{ include "rforum.fullname" . }}-postgres:5432/rforum"
