apiVersion: v1
kind: Service
metadata:
  name: {{ include "rforum.fullname" . }}-api
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "rforum.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: 8000
