apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rforum.fullname" . }}-uploads
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.api.uploadStorageClass }}
  storageClassName: {{ .Values.api.uploadStorageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.uploadStorage }}
