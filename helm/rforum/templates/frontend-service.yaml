apiVersion: v1
kind: Service
metadata:
  name: {{ include "rforum.fullname" . }}-frontend
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  selector:
    {{- include "rforum.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: 80
      {{- if and (eq .Values.service.frontend.type "NodePort") .Values.service.frontend.nodePort }}
      nodePort: {{ .Values.service.frontend.nodePort }}
      {{- end }}
