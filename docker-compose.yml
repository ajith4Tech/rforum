services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rforum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rforum}
      POSTGRES_DB: rforum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rforum"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Database migrations (runs once, exits) ──────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    working_dir: /workspace
    command: alembic -c db/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://rforum:${POSTGRES_PASSWORD:-rforum}@db:5432/rforum
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rforum:${POSTGRES_PASSWORD:-rforum}@db:5432/rforum
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    volumes:
      - uploads:/workspace/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── SvelteKit frontend (nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
