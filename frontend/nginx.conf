server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Compression lives here, not in Traefik: the rforum Ingresses have no
    # compress middleware, and this is the only layer serving the SPA. The
    # stock nginx:alpine config leaves gzip off, so the 90-120 KB global CSS
    # and the JS chunks went out uncompressed. Fonts (woff/woff2) and images
    # are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Content-hashed build output: a file's name changes whenever its content
    # does, so it can be cached forever. A missing file is a real 404, never
    # the SPA shell served as CSS/JS.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Files that name the current build must be revalidated on every load,
    # or a browser keeps an index.html pointing at hashed chunks that no
    # longer exist after a rollout (404 CSS → the app never mounts).
    # no-cache still allows a cheap ETag/304 revalidation. version.json is
    # what SvelteKit checks to detect a new deploy; service-worker.js
    # precaches the new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location /_app/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static files (favicon, logos, robots.txt) — not fingerprinted, so a
    # short cache; unknown paths fall back to the (no-cache) SPA shell.
    location / {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
