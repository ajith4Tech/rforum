server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the cache behavior of the current bare-metal nginx config
    # (nginx/sites-available/rforum on the existing VM): hashed immutable
    # build assets get a 1-year cache, everything else 1 hour.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
