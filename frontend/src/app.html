<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Rforum helps you run live sessions with polls, Q&A, and real-time audience engagement." />
    <meta name="keywords" content="Rforum, live polling, Q&A platform, event engagement, webinar tools" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Tech Good Community" />
    <meta name="google-site-verification" content="zZEyYitnF1VUICxD6LGovxRqJDMB-2aY5oVnuBiVZ4g" />
    <link rel="canonical" href="https://rforum.t4gc.in" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rforum.t4gc.in" />
    <meta property="og:title" content="Rforum – Live Interactive Event Platform" />
    <meta property="og:description" content="Rforum helps you run live sessions with polls, Q&A, and real-time audience engagement." />
    <meta property="og:site_name" content="Rforum" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rforum – Live Interactive Event Platform" />
    <meta name="twitter:description" content="Rforum helps you run live sessions with polls, Q&A, and real-time audience engagement." />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Rforum",
        "description": "Real-time audience engagement platform for live sessions with polls, Q&A, feedback, and word clouds",
        "url": "https://rforum.t4gc.in",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
    
    <title>Rforum – Live Interactive Event Platform</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
    <script>
      (function () {
        var theme = 'dark';
        try { theme = localStorage.getItem('rforum_theme') || 'dark'; } catch (e) {}
        var html = document.documentElement;
        html.className = theme === 'dark' ? 'dark' : '';
        html.setAttribute('data-theme', theme);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
