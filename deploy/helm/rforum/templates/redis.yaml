apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rforum.redis.fullname" . }}
  labels:
    {{- include "rforum.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rforum.redis.fullname" . }}
  labels:
    {{- include "rforum.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  # A single PVC-backed replica must fully terminate before its replacement
  # starts — RollingUpdate would leave two pods trying to mount the same
  # ReadWriteOnce volume at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rforum.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rforum.componentLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rforum.serviceAccountName" . }}
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rforum.redis.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rforum.redis.fullname" . }}
  labels:
    {{- include "rforum.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "rforum.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
