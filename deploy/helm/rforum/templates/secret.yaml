{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rforum.fullname" . }}
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgresql.auth.password is required when postgresql.enabled=true and postgresql.auth.existingSecret is unset — set it via --set/-f or point postgresql.auth.existingSecret at a pre-created Secret." .Values.postgresql.auth.password | quote }}
{{- end }}
---
{{- if not .Values.app.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rforum.app.secretName" . }}
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "app.secretKey is required when app.existingSecret is unset — generate one with `openssl rand -hex 32` and pass via --set/-f, or point app.existingSecret at a pre-created Secret." .Values.app.secretKey | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  aws-access-key-id: {{ .Values.storage.s3.accessKeyId | quote }}
  aws-secret-access-key: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
