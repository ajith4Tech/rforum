{{- if .Values.ingress.enabled }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "rforum.fullname" . }}
---
# Long-lived WebSocket path on its own Ingress so the WS ServersTransport
# (86400s forwarding timeouts) does not apply to /api or the frontend.
# Traefik proxies the Upgrade header by default.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $fullname }}-ws
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
spec:
  forwardingTimeouts:
    dialTimeout: 10s
    idleConnTimeout: {{ .Values.ingress.wsTimeoutSeconds }}s
    responseHeaderTimeout: {{ .Values.ingress.wsTimeoutSeconds }}s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-ws
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s-ws@kubernetescrd" $ns $fullname | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "rforum.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
---
# 25MB body cap for presentation uploads (matches historical nginx
# client_max_body_size 25m; the app still enforces UPLOAD_MAX_MB=20).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-upload-body
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ mul .Values.ingress.maxBodySizeMb 1048576 }}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
spec:
  forwardingTimeouts:
    dialTimeout: 10s
    idleConnTimeout: {{ .Values.ingress.apiTimeoutSeconds }}s
    responseHeaderTimeout: {{ .Values.ingress.apiTimeoutSeconds }}s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-main
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-upload-body@kubernetescrd" $ns $fullname | quote }}
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s-api@kubernetescrd" $ns $fullname | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "rforum.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rforum.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
