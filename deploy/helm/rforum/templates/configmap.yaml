apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rforum.fullname" . }}-config
  labels:
    {{- include "rforum.labels" . | nindent 4 }}
data:
  # Non-sensitive DB coordinates — DB_PASSWORD comes from the Secret and the
  # container entrypoint composes DATABASE_URL from these at startup so the
  # password never has to be templated into a rendered connection string.
  DB_HOST: {{ include "rforum.db.host" . | quote }}
  DB_PORT: {{ include "rforum.db.port" . | quote }}
  DB_NAME: {{ include "rforum.db.name" . | quote }}
  DB_USER: {{ include "rforum.db.user" . | quote }}

  ALGORITHM: {{ .Values.app.algorithm | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.app.accessTokenExpireMinutes | quote }}
  INVITE_CODE: {{ .Values.app.inviteCode | quote }}
  SUPER_ADMIN_EMAIL: {{ .Values.app.superAdminEmail | quote }}
  ORG_DISPLAY_NAME: {{ .Values.app.orgDisplayName | quote }}
  {{- $origins := .Values.app.corsOrigins }}
  {{- if not $origins }}
  {{- $scheme := ternary "https" "http" .Values.ingress.tls.enabled }}
  {{- $origins = list (printf "%s://%s" $scheme .Values.ingress.host) }}
  {{- end }}
  CORS_ORIGINS: {{ $origins | toJson | quote }}
  UPLOAD_MAX_MB: {{ .Values.app.uploadMaxMb | quote }}
  UPLOAD_ALLOWED_EXTENSIONS: {{ .Values.app.uploadAllowedExtensions | toJson | quote }}
  PRESENTATION_ORPHAN_RETENTION_DAYS: {{ .Values.app.presentationOrphanRetentionDays | quote }}
  DEFAULT_PAGE_SIZE: {{ .Values.app.pagination.defaultPageSize | quote }}
  MAX_PAGE_SIZE: {{ .Values.app.pagination.maxPageSize | quote }}

  JOIN_RATE_LIMIT: {{ .Values.app.rateLimit.joinLimit | quote }}
  JOIN_RATE_LIMIT_WINDOW_SECONDS: {{ .Values.app.rateLimit.joinWindowSeconds | quote }}
  WS_CONNECT_RATE_LIMIT: {{ .Values.app.rateLimit.wsConnectLimit | quote }}
  WS_CONNECT_RATE_WINDOW_SECONDS: {{ .Values.app.rateLimit.wsConnectWindowSeconds | quote }}
  RESPONSE_RATE_LIMIT_PER_GUEST: {{ .Values.app.rateLimit.responsePerGuest | quote }}
  RESPONSE_RATE_LIMIT_PER_GUEST_WINDOW_SECONDS: {{ .Values.app.rateLimit.responsePerGuestWindowSeconds | quote }}
  RESPONSE_RATE_LIMIT_PER_IP: {{ .Values.app.rateLimit.responsePerIp | quote }}
  RESPONSE_RATE_LIMIT_PER_IP_WINDOW_SECONDS: {{ .Values.app.rateLimit.responsePerIpWindowSeconds | quote }}

  STORAGE_PROVIDER: {{ .Values.storage.backend | quote }}
  STORAGE_ROOT: {{ .Values.storage.root | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  S3_BUCKET: {{ .Values.storage.s3.bucket | quote }}
  S3_REGION: {{ .Values.storage.s3.region | quote }}
  S3_ENDPOINT: {{ .Values.storage.s3.endpoint | quote }}
  S3_PREFIX: {{ .Values.storage.s3.prefix | quote }}
  S3_MAX_RETRIES: {{ .Values.storage.s3.maxRetries | quote }}
  {{- end }}