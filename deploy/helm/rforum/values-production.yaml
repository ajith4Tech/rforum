# Production overlay — sized for a larger VM (reference: 4 vCPU / 8GB, i.e.
# double the 2 vCPU / 3.7GB host the 500-guest k6 load test was validated
# against) and mirroring the actual rforum.t4gc.in configuration (S3-backed
# storage with local fallback). Merge with values.yaml:
#
#   helm upgrade --install rforum deploy/helm/rforum \
#     -f deploy/helm/rforum/values.yaml \
#     -f deploy/helm/rforum/values-production.yaml \
#     -f my-secrets.yaml \
#     --namespace rforum --create-namespace
#
# Secrets (app.secretKey, postgresql.auth.password, storage.s3.secretAccessKey,
# etc.) are intentionally NOT set here — supply them via a separate
# --set/-f file or existingSecret, never commit real values into this file.

image:
  backend:
    tag: "1.0.0"
  frontend:
    tag: "1.0.0"

backend:
  # Matches the validated load test topology (1 process, 2 uvicorn workers)
  # — see the caution in values.yaml before raising this.
  replicaCount: 1
  workers: 2
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 3Gi

frontend:
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

postgresql:
  enabled: true
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # pool_size=20 + max_overflow=10 per uvicorn worker (app/database.py) × 2
  # workers × 1 replica = up to 60 pooled connections — comfortably inside
  # Postgres's default max_connections=100. Re-check this arithmetic before
  # raising backend.replicaCount or backend.workers.

redis:
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

storage:
  # Matches the current production deployment: new writes go to S3, reads
  # fall back to the local PVC for anything uploaded before the S3
  # switchover (app/storage/fallback.py). Fill in storage.s3.bucket and
  # supply credentials via app.existingSecret (keys aws-access-key-id /
  # aws-secret-access-key) rather than storage.s3.secretAccessKey directly.
  backend: s3
  persistence:
    size: 30Gi
  s3:
    bucket: ""
    region: eu-north-1

ingress:
  host: rforum.example.com
  tls:
    enabled: true
    secretName: rforum-tls

migrations:
  enabled: true
